# 单文件部署编排。在仓库根目录执行：
#   docker compose --env-file .env -f deploy/docker-compose.yml up -d
#
# 这套编排对应已经定下来的架构，不再靠叠加文件切换：
#   - 数据库在宿主机上（不是容器），api 通过 host.docker.internal 连它
#   - web 同时监听 0.0.0.0:8080（公网 IP 打开后台）和 127.0.0.1:18080（SSH 隧道调试）
#
# 唯一保留的叠加文件是 docker-compose.https.yml —— 它依赖证书文件存在，没法并进来
# （没有证书时挂上 nginx.https.conf，nginx 会直接起不来）。
#
# name 固定项目名，避免文件搬家后网络名变成 deploy_*
name: self-reliant-gym-backend
# 内存预算（1.7G 机器）：宿主机系统 + dockerd 约 350MB，容器合计 192MB，
# 剩下的留给宿主 MySQL 和文件缓存。改大任何一项前先看 free -h。
services:
  api:
    build: {context: .., target: api, dockerfile: deploy/Dockerfile}
    # 数据库在容器外，没有 depends_on 保证它先就绪：api 启动时若连不上库，
    # 迁移会失败退出，没有 restart 策略容器就一直躺着。
    restart: unless-stopped
    mem_limit: 128m
    env_file: ../.env
    environment:
      # 值来自 .env；换云数据库只改那一行，这里不用动
      MYSQL_DSN: ${MYSQL_DSN:?.env 里缺少 MYSQL_DSN}
    # 容器内的 host.docker.internal 解析到 docker0 网关（172.17.0.1）
    extra_hosts:
      - "host.docker.internal:host-gateway"
  web:
    build: {context: .., target: web, dockerfile: deploy/Dockerfile}
    restart: unless-stopped
    mem_limit: 64m
    ports:
      # 8080 对公网，没有域名时用 IP:8080 打开后台
      - "0.0.0.0:8080:80"
      # 只绑本机，SSH 隧道调试用；与 8080 不冲突
      - "127.0.0.1:18080:80"
    depends_on: [api]
