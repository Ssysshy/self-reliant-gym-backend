# 对外 HTTPS 站点配置。配合 deploy/docker-compose.https.yml 使用：
#   docker compose --env-file .env -f deploy/docker-compose.yml -f deploy/docker-compose.https.yml up -d
#
# 用法：把下面的 api.example.com 全部替换成自己的域名（小程序的 request 合法域名要填同一个），
# 证书放到 deploy/certs/，文件名对不上就改 ssl_certificate 两行。
# 证书目录结构：
#   deploy/certs/fullchain.pem   服务器证书 + 中间证书（顺序不能反）
#   deploy/certs/privkey.pem     私钥
#
# 管理后台和接口在这个配置里同域：/ 是后台静态页，/api/ 反代给 Gin。
# 小程序端只需要登记 https://api.example.com 这一个 request 域名。

# ── HTTP：只做跳转，避免小程序/浏览器停在明文上 ──────────────────────
server {
    listen 80;
    server_name api.example.com;

    # certbot webroot 续期要用这个路径，必须放在跳转之前
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # 只留 TLS 1.2/1.3：微信小程序不接受 TLS 1.0/1.1
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 证书确认没问题后再打开，否则回滚期间浏览器会拒绝明文访问
    # add_header Strict-Transport-Security "max-age=31536000" always;

    root /usr/share/nginx/html;
    client_max_body_size 512k;

    location /api/ {
        proxy_pass http://api:18080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / { try_files $uri $uri/ /index.html; }
}
