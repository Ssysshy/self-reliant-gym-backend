# 用公网 IP 直接访问后台管理页的叠加配置（还没有域名和证书时用这个）。
#
#   docker compose --env-file .env -f deploy/docker-compose.yml -f deploy/docker-compose.public.yml up -d
#
# 只做一件事：给 web 补一个面向公网的端口绑定。基础文件里的 127.0.0.1:18080:80
# 保留不动，那条仍给 SSH 隧道调试用。
#
# 几个刻意的选择：
# - 用 8080 而不是 18080：同一个宿主机端口不能绑两次（127.0.0.1:18080 已占用），
#   换端口比用 !override 重置更安全，也不依赖 compose 版本。
# - 不绑 80：国内未备案时按域名拦 HTTP，用 IP 走 80 多数情况能通但不稳，
#   非标端口也更省事，将来接入 HTTPS 时不会和叠加文件的 80/443 打架。
# - 只在需要时叠加。不加这个 -f 就退回"只有本机能访问"，回滚不用改任何文件：
#
#     docker compose --env-file .env -f deploy/docker-compose.yml up -d

services:
  web:
    ports:
      - "0.0.0.0:8080:80"
