# ═══════════════════════════════════════════════════════════════════
# 限流 zone 定义（http 级别，必须放在 http {} 里）
#
# 放置位置：
#   sudo cp nginx.limit.conf /etc/nginx/conf.d/gym-limit.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Ubuntu 的 /etc/nginx/nginx.conf 会 include /etc/nginx/conf.d/*.conf，
# 所以这份放 conf.d/ 就落在 http 里；放到 sites-enabled/ 会报 unknown directive。
#
# ── 这一层管什么 ──────────────────────────────────────────────────
# 按客户端 IP 限，目标是挡住「同一台机器换着接口刷」。它不管账号：同一 WiFi 下
# 几十个真实用户共用一个出口 IP，是按 IP 限流最容易误伤的地方，所以各个 rate
# 都按「一整间健身房同时进门」来留余量，宁松不严。
# 账号维度的限额在 API 里（internal/handler/limit.go，按 uid 的令牌桶）。
#
# ── 参数含义 ──────────────────────────────────────────────────────
# limit_req 是漏桶：rate 是长期放行速率，burst 是允许瞬时堆积的量，配 nodelay
# 时 burst 内的请求立刻放行、超出的直接 429，不排队（排队会让小程序卡住转圈）。
#
# ── 换 CDN 时必须改这里 ───────────────────────────────────────────
# 前面一旦套上 CDN 或负载均衡，$binary_remote_addr 全是回源节点 IP，所有用户会
# 挤进同一个桶。届时必须启用 real_ip 模块（set_real_ip_from + real_ip_header），
# 并把下面 key 换成还原后的真实 IP，否则限流等于没有。
# ═══════════════════════════════════════════════════════════════════

# 小程序业务接口。一次页面加载会并发 5~8 个请求（首页就同时打 me/plans/buddies），
# 30r/s 配 burst 60 给足正常使用的余量，刷子也上不了量。
limit_req_zone $binary_remote_addr zone=gym_api:10m rate=30r/s;

# 微信登录。入口本身要消耗一次 jscode2session 并写库，是公开接口里最贵的一个。
# 但健身房里几十人连同一 WiFi 同时打开小程序是正常场景，不能按「一人一次」卡，
# 所以速率给到 2r/s、突发 60。
limit_req_zone $binary_remote_addr zone=gym_login:10m rate=120r/m;

# 后台登录。只有一个运营在用，10 次/分钟够用；这条同时是口令爆破的门槛，
# 后台密码再弱也挡得住轮询。
limit_req_zone $binary_remote_addr zone=gym_admin:5m rate=10r/m;
