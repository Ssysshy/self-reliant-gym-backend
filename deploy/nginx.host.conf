# ═══════════════════════════════════════════════════════════════════
# 宿主机 Nginx 配置（Ubuntu 24.04 / nginx 1.24）
#
# 放置位置：
#   sudo cp nginx.host.conf /etc/nginx/sites-available/gym.conf
#   sudo ln -sf /etc/nginx/sites-available/gym.conf /etc/nginx/sites-enabled/gym.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 链路：
#   gymadmin.voiddiver.cn → 127.0.0.1:8080  web 容器（静态页 + 同源 /api/ 反代）
#   gymapi.voiddiver.cn   → 127.0.0.1:8080  只放行 /api/v1/，给微信小程序
#
# 部署前只需改三处：两对证书路径。若手上是一张同时覆盖两个域名的证书，
# 两个 443 块都指向同一个文件即可。
#
# 注意：nginx 1.24 不支持 `http2 on;`（1.25.1 才加入），必须写成
#       `listen 443 ssl http2;`，否则报 unknown directive "http2"。
# ═══════════════════════════════════════════════════════════════════


# ── gymadmin.voiddiver.cn：管理后台 ────────────────────────────────
server {
    listen 80;
    server_name gymadmin.voiddiver.cn;

    # 证书续期验证路径必须放在跳转之前，否则 certbot 校验会 301 到 https 而失败
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name gymadmin.voiddiver.cn;

    # ↓↓↓ 改成 /ssl 下的真实文件名 ↓↓↓
    ssl_certificate     /ssl/gymadmin.voiddiver.cn.pem;
    ssl_certificate_key /ssl/gymadmin.voiddiver.cn.key;
    # ↑↑↑ 一张证书覆盖两个域名时，这里与下面 gymapi 的块写同一个文件 ↑↑↑

    # 微信小程序只接受 TLS 1.2 及以上
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 与容器内 nginx 的 512k 保持一致。以后要上传大图，两处必须一起放大，
    # 只放大这里会在容器那一层仍被 413 挡住。
    client_max_body_size 512k;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 复用与后端的连接
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_read_timeout   60s;
    }
}


# ── gymapi.voiddiver.cn：只对外提供 /api/v1/ ───────────────────────
# 后台管理接口在 /api/admin/v1/，不在这里暴露，避免管理面挂在接口域上。
server {
    listen 80;
    server_name gymapi.voiddiver.cn;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name gymapi.voiddiver.cn;

    ssl_certificate     /ssl/gymapi.voiddiver.cn.pem;
    ssl_certificate_key /ssl/gymapi.voiddiver.cn.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 512k;

    # 转发给 web 容器的 nginx，由它里面的 /api/ 规则继续转给 api:18080。
    # 这样不用给 api 容器额外发布端口，编排文件保持不动。
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_read_timeout   60s;
    }

    # 除 /api/v1/ 外一律不对外。不要删这段，否则接口域会把后台静态页一起吐出去。
    location / { return 404; }
}
