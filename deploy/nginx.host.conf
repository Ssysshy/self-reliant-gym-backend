# ═══════════════════════════════════════════════════════════════════
# 宿主机 Nginx 配置（Ubuntu 24.04 / nginx 1.24）
#
# 放置位置：
#   sudo cp nginx.limit.conf /etc/nginx/conf.d/gym-limit.conf   # 限流 zone，必须在 http 里
#   sudo cp nginx.host.conf  /etc/nginx/sites-available/gym.conf
#   sudo ln -sf /etc/nginx/sites-available/gym.conf /etc/nginx/sites-enabled/gym.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 本文件引用了 nginx.limit.conf 里定义的 gym_api / gym_login / gym_admin 三个 zone。
# 少了那份，nginx -t 会报 unknown limit_req zone，整站起不来——两份必须配套部署。
#
# 链路：
#   gymadmin.voiddiver.cn → 127.0.0.1:18080  web 容器（静态页 + 同源 /api/ 反代）
#   gymapi.voiddiver.cn   → 127.0.0.1:18080  只放行 /api/v1/，给微信小程序
#
# 18080 是容器唯一的对外映射，且只绑 127.0.0.1（见 docker-compose.yml）。
# 不要退回 8080：那个端口曾对公网开放，能绕过本文件的 /api/v1/ 收口直接摸后台。
#
# 证书路径按线上实际文件名写死（/ssl/admin、/ssl/api 两个目录）。
# 换证书时保持文件名不变即可，本文件不用动。
#
# 注意：nginx 1.24 不支持 `http2 on;`（1.25.1 才加入），必须写成
#       `listen 443 ssl http2;`，否则报 unknown directive "http2"。
# ═══════════════════════════════════════════════════════════════════


# ── gymadmin.voiddiver.cn：管理后台 ────────────────────────────────
server {
    listen 80;
    server_name gymadmin.voiddiver.cn;

    # 证书续期验证路径必须放在跳转之前，否则 certbot 校验会 301 到 https 而失败
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name gymadmin.voiddiver.cn;

    # 线上实际文件：/ssl/admin/cert.pem 是 leaf + 中间证书，cert.key 是私钥
    ssl_certificate     /ssl/admin/cert.pem;
    ssl_certificate_key /ssl/admin/cert.key;
    # 一张证书覆盖两个域名时，这里与下面 gymapi 的块写同一个文件

    # 微信小程序只接受 TLS 1.2 及以上
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 与容器内 nginx 的 512k 保持一致。以后要上传大图，两处必须一起放大，
    # 只放大这里会在容器那一层仍被 413 挡住。
    client_max_body_size 512k;

    # 限流回 429，并把响应体换成 JSON。默认的 429 是一张 HTML 错误页，
    # 小程序 api.ts 读的是 body.error，拿到 HTML 只能显示「请求失败」。
    limit_req_status 429;
    error_page 429 = @busy;

    # 后台登录是整站唯一免会话的写入口，单独卡一道（10 次/分钟），兼作口令爆破门槛。
    # limit_req 不能按路径细分，所以这里只能另开 location，代理头跟着复制一份。
    location = /api/admin/v1/login {
        limit_req zone=gym_admin burst=10 nodelay;

        proxy_pass http://127.0.0.1:18080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_read_timeout   60s;
    }

    location / {
        proxy_pass http://127.0.0.1:18080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 复用与后端的连接
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_read_timeout   60s;
    }

    # 限流命中走这里：状态码仍是 429，只把 body 换成小程序能读的 JSON
    location @busy {
        default_type application/json;
        return 429 '{"error":"操作太频繁，请稍后再试"}';
    }
}


# ── gymapi.voiddiver.cn：只对外提供 /api/v1/ ───────────────────────
# 后台管理接口在 /api/admin/v1/，不在这里暴露，避免管理面挂在接口域上。
server {
    listen 80;
    server_name gymapi.voiddiver.cn;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name gymapi.voiddiver.cn;

    ssl_certificate     /ssl/api/cert.pem;
    ssl_certificate_key /ssl/api/cert.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 512k;

    limit_req_status 429;
    error_page 429 = @busy;

    # 微信登录单独一个 zone：它是公开接口里最贵的一个（一次 jscode2session + 一次
    # 写库），但健身房里几十人连同一 WiFi 同时登录是正常场景，速率按「整间店同时
    # 进门」放宽，见 nginx.limit.conf。
    location = /api/v1/auth/wechat {
        limit_req zone=gym_login burst=60 nodelay;

        proxy_pass http://127.0.0.1:18080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_read_timeout   60s;
    }

    # 转发给 web 容器的 nginx，由它里面的 /api/ 规则继续转给 api:18080。
    # 这样不用给 api 容器额外发布端口，编排文件保持不动。
    location /api/v1/ {
        # IP 维度的兜底限流；账号维度的额度在 API 里按 uid 算（handler/limit.go）
        limit_req zone=gym_api burst=60 nodelay;

        proxy_pass http://127.0.0.1:18080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_read_timeout   60s;
    }

    # 除 /api/v1/ 外一律不对外。不要删这段，否则接口域会把后台静态页一起吐出去。
    location / { return 404; }

    location @busy {
        default_type application/json;
        return 429 '{"error":"操作太频繁，请稍后再试"}';
    }
}
